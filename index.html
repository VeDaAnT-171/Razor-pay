};
function resolveFlash(root, ok, label) {
  var panel = qs(".modal-panel", root);
  if (!panel) return sleep(0);
  var div = document.createElement("div");
  div.className = "resolve-flash " + (ok ? "ok" : "bad");
  div.innerHTML = '<div class="rf-icon">' + (ok ? "✓" : "✕") + '</div><div class="rf-label">' + esc(label) + '</div>';
  panel.appendChild(div);
  return sleep(620);
}
function openApprovalReview(id, isLive) {
  var a = allApprovals().find(function (x) { return String(x.id) === String(id); });
  if (!a) return;
  openModal({
    title: "Review — " + a.title, wide: true,
    body:
      '<div class="money-hero"><div class="mh-label">Amount</div><div class="mh-amount">' + (a.amount ? inr(a.amount) : "—") + '</div><div class="mh-sub">' + (isLive ? "Checkout session " + esc(a.buyer) : "Buyer " + esc(a.buyer)) + '</div></div>' +
      '<h4 style="font-size:12.5px; text-transform:uppercase; color:var(--text-soft); margin-bottom:8px;">Reason</h4>' +
      '<p style="font-size:13px; color:var(--text-soft);">' + esc(a.reason) + '</p>' +
      (isLive ? '<div class="field" style="margin-top:14px;"><label>New authorization limit (₹) — only used by "Approve with new limit"</label><input type="number" id="modLimit" value="' + (a.amount || 0) + '"></div>' :
        '<h4 style="font-size:12.5px; text-transform:uppercase; color:var(--text-soft); margin:16px 0 8px;">Policy checks</h4>' + safetyPanelHtml(a.amount || 0, STATE.policy.humanApprovalAbove)),
    foot:
      '<button class="btn danger sm" data-resolve="rejected">Reject</button>' +
      (isLive ? '<button class="btn sm" data-resolve="modify">Approve with new limit</button>' : '<button class="btn sm" data-resolve="modified">Modify</button><button class="btn sm" data-resolve="new-limit">Approve with new limit</button>') +
      '<button class="btn primary sm" data-resolve="approved">Approve</button>',
    onMount: function (root) {
      qsa("[data-resolve]", root).forEach(function (btn) {
        on(btn, "click", async function () {
          qsa("[data-resolve]", root).forEach(function (b) { b.disabled = true; });
          var action = btn.getAttribute("data-resolve");
          if (isLive) {
            var apiAction = action === "rejected" ? "reject" : action === "modify" ? "modify" : "approve";
            var body = { approval_id: a.id, action: apiAction };
            if (apiAction === "modify") body.modified_limit_inr = Number(qs("#modLimit", root).value) || a.amount;
            var r = await apiFetch("/agent/v1/approvals/resolve", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
            if (r.ok) {
              var pastTense = apiAction === "reject" ? "rejected" : apiAction === "modify" ? "approved with a new limit" : "approved";
              await resolveFlash(root, apiAction !== "reject", apiAction === "reject" ? "Rejected" : apiAction === "modify" ? "Approved — new limit" : "Approved");
              closeModal();
              toast("Approval " + pastTense + " — real order created if applicable.", apiAction === "reject" ? "err" : "ok");
              syncLive("approvals"); syncLive("sessions"); renderRoute();
            }
            else { closeModal(); toast((r.body && r.body.error) || "Approval action failed.", "err"); }
            return;
          }
          a.status = action === "approved" || action === "new-limit" ? "approved" : action === "rejected" ? "rejected" : "modified";
          var demoRec = STATE.approvals.find(function (x) { return x.id === a.id; });
          if (demoRec) demoRec.status = a.status;
          auditAppend("SETTLEMENT", a.status === "rejected" ? "FAIL" : "PASS", "human_approver", "Approval \"" + a.title + "\" resolved: " + a.status + " (SIMULATED)", { approval_id: a.id });
          pushActivity(a.status === "approved" ? "check" : "alertTriangle", "Approval " + a.status + ": " + a.title, "approvals");
          await resolveFlash(root, a.status !== "rejected", a.status === "approved" ? "Approved" : a.status === "rejected" ? "Rejected" : "Modified");
          closeModal(); toast("Approval " + a.status + " (SIMULATED — local demo approval).", a.status === "rejected" ? "err" : "ok"); renderRoute();
        });
      });
    }
  });
}

async function runFailureSimulation() {

    '</div>' +

function resolveRecovery(action, result) {
  var labels = { qty: "Reduced quantity to fit authorization", human: "Requested human approval", refresh: "Refreshed quote at current price", cancel: "Cancelled by buyer" };

    pushNotification("hourglass", "warn", "New approval from a recovered failure.", "approvals");
  }
  if (action !== "cancel") {
    STATE.recovered.unshift({ id: uid("rec"), action: labels[action], amount: result.attempted_total_inr, time: "just now" });
    STATE.recovered_amount = (STATE.recovered_amount || 0) + result.attempted_total_inr;
  }
  auditAppend("SETTLEMENT", "INFO", "guardrail_gate", labels[action], { action: action });

function mountPolicySimulator(view) {
  on(qs("#ps_run", view), "click", function () {

    var res = evaluatePolicy(cart);

      verdictHeroHtml(res.verdict, inr(res.total) + " — " + res.reason, { animate: true }) +
      '<div class="check-list" style="margin-bottom:14px;">' + res.checks.map(function (c) { return '<div class="check-item ' + (c.pass ? "pass" : "fail") + '"><span class="ico">' + (c.pass ? "✓" : "✕") + '</span><span style="flex:1;">' + c.label + '</span><span style="font-size:11.5px; color:var(--text-faint);">' + (c.pass ? "PASS" : "FAIL") + '</span></div>'; }).join("") + '</div>' +
      (res.verdict !== "APPROVED" ? '<div class="row gap-8" style="flex-wrap:wrap;">' +
        '<button class="btn sm" id="ps_reqhuman">Request human approval</button>' +
        '<button class="btn sm" id="ps_reduceqty">Reduce quantity</button>' +
        '<button class="btn sm" id="ps_cheaper">Try a different cart</button>' +
      '</div>' : '');
    on(qs("#ps_reqhuman", out), "click", function () {
      STATE.approvals.unshift({ id: uid("appr"), kind: "limit", title: inr(res.total) + " purchase (policy sim)", buyer: "Policy Simulator", reason: res.reason, amount: res.total, status: "pending", created: "just now" });
      toast("Sent for human approval.", "warn"); navigate("approvals");
    });

  });

function seedAuditIfEmpty() {

/** Outcome → color tone, one place so FAIL/PENDING/PASS/INFO never drift
 * out of sync between the timeline dot, the row badge, and the detail
 * modal (spec Step 6 — blocked and needs-approval must never look alike). */
function auditTone(outcome) {
  return outcome === "FAIL" ? "bad" : outcome === "PENDING" ? "warn" : outcome === "PASS" ? "ok" : "neutral";
}
// Entries already painted once on the Audit Trail — anything new since
// gets a brief arrival animation instead of silently appearing.
var AUDIT_SEEN_IDS = new Set();
VIEWS["audit"] = function () {
  seedAuditIfEmpty();
  var entries = STATE.audit.slice().reverse();
  return pageHead("Audit Trail", "Every money action, hash-chained. Nothing here can be edited without breaking the chain — verify it any time.",
    '<button class="btn sm" id="exportAuditCsvBtn">Export CSV</button> <button class="btn primary" id="verifyChainBtn">Verify entire chain</button>') +
    '<div class="card card-pad" id="chainVerifyResult" style="margin-bottom:18px; display:none;"></div>' +
    '<div class="card card-pad"><div class="timeline">' +
    entries.map(function (e) {
      var t = new Date(e.timestamp).toLocaleTimeString("en-IN", { hour12: false });
      var tone = auditTone(e.outcome);
      var isNew = !AUDIT_SEEN_IDS.has(e.id);
      var cls = (e.outcome === "FAIL" ? "fail " : e.outcome === "PENDING" ? "pending " : "") + (isNew ? "new-entry" : "");
      return '<div class="tl-item ' + cls + '" data-audit-id="' + e.id + '" title="Click for the full entry">' +
        '<div class="tl-time mono">' + t + '</div>' +
        '<div class="tl-action">' + e.step.replace(/_/g, " ") + (tone !== "neutral" ? ' <span class="badge ' + tone + '">' + esc(e.outcome) + '</span>' : '') + '</div>' +
        '<div class="tl-detail">' + esc(e.reason) + ' <span style="color:var(--text-faint);">· ' + esc(e.actor) + '</span></div>' +
        '<div class="tl-hash mono">hash: ' + e.hash.slice(0, 12) + '… · prev: ' + e.prevHash.slice(0, 8) + '…</div>' +
      '</div>';
    }).join("") +
    '</div></div>';
};
window.__routeMount["audit"] = function (view) {
  STATE.audit.forEach(function (e) { AUDIT_SEEN_IDS.add(e.id); });
  qsa("[data-audit-id]", view).forEach(function (el) { on(el, "click", function () { openAuditDetail(el.getAttribute("data-audit-id")); }); });
  on(qs("#exportAuditCsvBtn"), "click", function () {
    var cols = ["timestamp", "step", "outcome", "actor", "reason", "hash", "prev_hash"];
    var rows = STATE.audit.map(function (e) {
      return [e.timestamp, e.step, e.outcome, e.actor, e.reason, e.hash, e.prevHash];
    });
    downloadCsv("a-cos-audit-trail", cols, rows);
    toast("Audit trail exported.", "ok");
  });
  on(qs("#verifyChainBtn"), "click", async function () {
    var box = qs("#chainVerifyResult");
    var items = qsa(".tl-item", view);
    // Motion moment: sweep down the chain link-by-link before the verdict
    // lands, so "verify" reads as actually checking every entry, not just
    // flipping a boolean.
    box.style.display = "block"; box.innerHTML = '<div class="row gap-8" style="align-items:center;"><div class="skeleton" style="height:18px; width:18px; border-radius:50%;"></div><span style="font-size:13px; color:var(--text-soft);">Verifying ' + STATE.audit.length + ' hash-chained entries…</span></div>';
    var sweepMs = Math.min(60, Math.floor(900 / Math.max(1, items.length)));
    items.forEach(function (el, i) { setTimeout(function () { el.classList.add("verifying"); }, i * sweepMs); });
    await sleep(items.length * sweepMs + 200);
    var res = await verifyAuditChain();
    STATE.auditChainOk = res.valid;
    box.innerHTML = res.valid
      ? '<div class="verdict-hero ok enter" style="margin-bottom:0;"><div class="vh-icon">✓</div><div><div class="vh-label">Chain verified</div><div class="vh-sub">' + STATE.audit.length + ' records checked. No integrity violations detected.</div></div></div>'
      : '<div class="verdict-hero bad enter shake" style="margin-bottom:0;"><div class="vh-icon">✕</div><div><div class="vh-label">Chain broken</div><div class="vh-sub">Integrity violation at entry ' + res.brokenAt + '.</div></div></div>';
    if (STATE.connected) {
      var r = await apiFetch("/agent/v1/audit/verify-chain");
      if (r.ok && r.body) box.innerHTML += '<div style="margin-top:10px; font-size:12px; color:var(--text-faint);">Server audit chain (live): ' + (r.body.valid ? "✓ verified" : "✕ broken") + '</div>';
    }
  });
};

window.__routeMount["dev-webhooks"] = function () {

  }

      confirmLabel: "Rotate key",
      danger: true
    }, async function () {

      STATE.apiKey = r.body.api_key;

        '<div class="check-list">' +
          '<div class="check-item pass"><span class="ico">1</span><span style="flex:1;"><b>Set the policy</b> — spend limits, categories, discount caps, per-agent authorization.</span></div>' +
          '<div class="check-item pass"><span class="ico">2</span><span style="flex:1;"><b>Every agent purchase is checked against it</b> — automatically, before money moves.</span></div>' +
          '<div class="check-item pass"><span class="ico">3</span><span style="flex:1;"><b>Anything borderline goes to a human</b>; everything is logged to a hash-chained audit trail you can verify any time.</span></div>' +
        '</div>' +
        '<p style="font-size:11.5px; color:var(--text-faint); margin-top:14px;">The next few steps get your store set up to do this. Takes under two minutes.</p>' },
    { title: "Connect your A-COS server",
      body: '<p style="font-size:13px; color:var(--text-soft); margin-bottom:14px;">Point this dashboard at your running A-COS backend (Test Mode). Razorpay keys live in its <span class="mono">.env</span> file, not here.</p>' +
        '<div class="field"><label>API base URL</label><input type="text" id="ob_base" value="' + esc(STATE.apiBase) + '"></div>' +
        '<span class="pill pill-test"><span class="dot"></span>Test Mode</span>' },
    { title: "Import catalog",
      body: '<p style="font-size:13px; color:var(--text-soft); margin-bottom:12px;">Choose a source. This demo ships with a 5-product catalog pre-loaded.</p>' +
        '<div class="row gap-8" style="flex-wrap:wrap;"><span class="badge primary">Demo catalog (active)</span><span class="badge neutral">Razorpay</span><span class="badge neutral">CSV</span><span class="badge neutral">API</span></div>' },
    { title: "Configure AI policy",
      body: '<div class="field"><label>Autonomous limit (₹)</label><input type="number" id="ob_limit" value="' + STATE.policy.maxAutoOrder + '"></div>' +
        '<div class="field"><label>Maximum discount (%)</label><input type="number" id="ob_disc" value="' + STATE.policy.maxDiscountPct + '"></div>' },
    { title: "Launch AI storefront",
      body: '<div class="check-list">' +
        '<div class="check-item pass"><span class="ico">✓</span>Catalog ready (' + STATE.catalog.length + ' products)</div>' +
        '<div class="check-item pass"><span class="ico">✓</span>Policy configured</div>' +
        '<div class="check-item ' + (STATE.connected ? "pass" : "pending") + '"><span class="ico">' + (STATE.connected ? "✓" : "…") + '</span>Backend ' + (STATE.connected ? "connected" : "will run in demo mode until connected") + '</div>' +
      '</div>' }
  ];
  function render() {
    var s = steps[step];
    openModal({
      title: step === 0 ? s.title : "Setup · Step " + step + " of " + (steps.length - 1) + " — " + s.title,
      body: s.body,
      foot: (step > 0 ? '<button class="btn" id="ob_back">Back</button>' : '') + '<button class="btn primary" id="ob_next">' + (step === 0 ? "Get started" : step === steps.length - 1 ? "Launch" : "Continue") + '</button>',
      onMount: function (root) {
        on(qs("#ob_back", root), "click", function () { step--; render(); });

/* ---------------------------------------------------------------------
 * SECTION: Auth gate — real signup/login screen. Nothing past this gate
 * renders until a real Dashboard JWT is present. Two credential types are
 * involved: the JWT (this screen) and the Agent API key, which the server
 * shows only once (at signup, or on a deliberate rotation in Settings) —
 * see apiFetch's AGENT_KEY_PREFIXES routing above for why both exist.
 * ------------------------------------------------------------------- */
var authTab = "login";
var authKeyToShow = null; // { key, merchant } — set right after a successful signup, until the merchant confirms they saved it
var pendingResetToken = null; // raw reset token pulled from a #/reset-password/<token> link, consumed by the reset form

function setAppVisible(visible) {
  var shell = qs("#shell"), bn = qs("#bottomnav"), gate = qs("#authScreen");
  if (shell) shell.style.display = visible ? "" : "none";
  if (bn) bn.style.display = visible ? "" : "none";
  if (gate) gate.style.display = visible ? "none" : "flex";
}

/** Call whenever auth state may have changed — decides gate vs. app and (re)starts the app exactly once. */
var appStarted = false;
function renderAuthGate() {
  if (STATE.jwt) {
    setAppVisible(true);
    if (!appStarted) { appStarted = true; startApp(); }
  } else {
    appStarted = false;
    setAppVisible(false);
    renderAuthScreen();
  }
}

function renderAuthScreen() {
  var root = qs("#authScreen");
  if (!root) return;
  if (authKeyToShow) { root.innerHTML = renderAuthKeyConfirm(); wireAuthKeyConfirm(root); return; }

  if (authTab === "forgot" || authTab === "reset") {
    root.innerHTML =
      '<div class="auth-card card card-pad">' +
        '<div class="auth-brand"><div class="mark">A</div><div><div class="name">A-COS</div><div class="tag">AI Commerce OS</div></div></div>' +
        '<div class="auth-error" id="authError"></div>' +
        (authTab === "forgot" ? renderForgotForm() : renderResetForm()) +
      '</div>';
    wireForgotResetForms(root);
    return;
  }

  root.innerHTML =
    '<div class="auth-card card card-pad">' +
      '<div class="auth-brand"><div class="mark">A</div><div><div class="name">A-COS</div><div class="tag">AI Commerce OS</div></div></div>' +
      '<div class="auth-tabs">' +
        '<div class="auth-tab' + (authTab === "login" ? " active" : "") + '" data-tab="login">Log in</div>' +
        '<div class="auth-tab' + (authTab === "signup" ? " active" : "") + '" data-tab="signup">Create account</div>' +
      '</div>' +
      '<div class="auth-error" id="authError"></div>' +
      (authTab === "login" ? renderLoginForm() : renderSignupForm()) +
      '<div class="field-hint" style="text-align:center; margin-top:14px;">API base: <span class="mono">' + esc(STATE.apiBase) + '</span> — change it in Settings after logging in, or edit apiBase in this page before signing up.</div>' +
    '</div>';

  qsa(".auth-tab", root).forEach(function (el) {
    on(el, "click", function () { authTab = el.getAttribute("data-tab"); renderAuthScreen(); });
  });
  wireAuthForm(root);
  var forgotLink = qs("#gotoForgot", root);
  if (forgotLink) on(forgotLink, "click", function (e) { e.preventDefault(); authTab = "forgot"; renderAuthScreen(); });
}

function wireForgotResetForms(root) {
  on(qs("#backToLogin1", root), "click", function (e) { e.preventDefault(); authTab = "login"; location.hash = ""; renderAuthScreen(); });
  on(qs("#backToLogin2", root), "click", function (e) { e.preventDefault(); authTab = "login"; location.hash = ""; renderAuthScreen(); });

  var forgotForm = qs("#forgotForm", root);
  if (forgotForm) {
    on(forgotForm, "submit", async function (e) {
      e.preventDefault();
      var btn = qs("#forgotSubmit", root);
      btn.disabled = true; btn.textContent = "Sending…";
      var email = qs("#fp_email", root).value.trim();
      var r = await apiFetch("/auth/forgot-password", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: email }) });
      btn.disabled = false; btn.textContent = "Send reset link";
      if (r.networkError) {
        var errEl = qs("#authError", root); errEl.textContent = "Could not reach " + STATE.apiBase + ". Check the API base URL."; errEl.classList.add("show");
        return;
      }
      forgotForm.innerHTML = '<p style="font-size:13.5px; line-height:1.6;">If an account exists for <b>' + esc(email) + '</b>, a reset link is on its way. It\'s valid for 1 hour.</p>' +
        '<div style="text-align:center; margin-top:16px;"><a href="#" id="backToLogin1b" style="font-size:12.5px;">Back to log in</a></div>';
      on(qs("#backToLogin1b", root), "click", function (e2) { e2.preventDefault(); authTab = "login"; location.hash = ""; renderAuthScreen(); });
    });
  }

  var resetForm = qs("#resetForm", root);
  if (resetForm) {
    on(resetForm, "submit", async function (e) {
      e.preventDefault();
      var errEl = qs("#authError", root); errEl.classList.remove("show"); errEl.textContent = "";
      var btn = qs("#resetSubmit", root);
      btn.disabled = true; btn.textContent = "Saving…";
      var pw = qs("#rp_password", root).value;
      var r = await apiFetch("/auth/reset-password", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: pendingResetToken, new_password: pw }) });
      btn.disabled = false; btn.textContent = "Set new password";
      if (!r.ok) {
        errEl.textContent = (r.body && r.body.error) || (r.networkError ? "Could not reach " + STATE.apiBase + "." : "Could not reset password.");
        errEl.classList.add("show");
        return;
      }
      pendingResetToken = null;
      resetForm.innerHTML = '<p style="font-size:13.5px; line-height:1.6;">Password updated. You can log in with your new password now.</p>' +
        '<button class="btn primary block" id="resetDoneBtn" style="margin-top:14px;">Go to log in</button>';
      on(qs("#resetDoneBtn", root), "click", function () { authTab = "login"; location.hash = ""; renderAuthScreen(); });
    });
  }
}
function renderSignupForm() {
  return '<form id="authForm" novalidate>' +
    '<div class="field"><label>Business name</label><input type="text" id="af_name" required></div>' +
    '<div class="field"><label>Email</label><input type="email" id="af_email" autocomplete="username" required></div>' +
    '<div class="field"><label>Password</label><input type="password" id="af_password" minlength="8" autocomplete="new-password" required></div>' +
    '<div class="field-hint" style="margin:-8px 0 14px;">At least 8 characters.</div>' +
    '<button class="btn primary block" type="submit" id="authSubmit">Create account</button>' +
  '</form>';
}

function wireAuthForm(root) {
  var form = qs("#authForm", root);
  if (!form) return;
  on(form, "submit", async function (e) {
    e.preventDefault();
    var errEl = qs("#authError", root);
    errEl.classList.remove("show"); errEl.textContent = "";
    var submitBtn = qs("#authSubmit", root);
    submitBtn.disabled = true;
    var origLabel = submitBtn.textContent;
    submitBtn.textContent = authTab === "login" ? "Logging in…" : "Creating account…";

    var email = qs("#af_email", root).value.trim();
    var password = qs("#af_password", root).value;

    try {
      if (authTab === "login") {
        var r = await apiFetch("/auth/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: email, password: password }) });
        if (!r.ok) {
          errEl.textContent = (r.body && r.body.error) || (r.networkError ? "Could not reach " + STATE.apiBase + ". Check the API base URL." : "Log in failed.");
          errEl.classList.add("show");
          return;
        }
        saveAuth(r.body.token, r.body.merchant, null);
        toast("Welcome back, " + r.body.merchant.name + ".", "ok");
        renderAuthGate();
      } else {
        var name = qs("#af_name", root).value.trim();
        var r2 = await apiFetch("/auth/signup", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: name, email: email, password: password }) });
        if (!r2.ok) {
          errEl.textContent = (r2.body && (r2.body.error || (r2.body.issues && r2.body.issues[0] && r2.body.issues[0].message))) || (r2.networkError ? "Could not reach " + STATE.apiBase + ". Check the API base URL." : "Sign-up failed.");
          errEl.classList.add("show");
          return;
        }
        saveAuth(r2.body.token, r2.body.merchant, r2.body.api_key);
        // The API key is shown by the server exactly once. Force the
        // merchant to see and acknowledge it before entering the dashboard.
        authKeyToShow = { key: r2.body.api_key, merchant: r2.body.merchant };
        renderAuthScreen();
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = origLabel;
    }
  });
}

function renderAuthKeyConfirm() {
  var k = authKeyToShow.key;
  return '<div class="auth-card card card-pad">' +
    '<div class="auth-brand"><div class="mark">A</div><div><div class="name">Account created</div><div class="tag">' + esc(authKeyToShow.merchant.name) + '</div></div></div>' +
    '<p style="font-size:13px; color:var(--text-soft); margin:0 0 6px;">This is your <b>Agent API key</b> — the credential AI shopping agents use to call your store\'s catalog and checkout. It is shown <b>only once</b>. Store it somewhere safe; you can rotate it later from Settings if you lose it (rotating invalidates this one).</p>' +
    '<div class="auth-keybox"><div style="font-weight:600; color:var(--text-soft);">Agent API key</div><div class="key" id="authKeyText">' + esc(k) + '</div></div>' +
    '<button class="btn" type="button" id="authKeyCopy" style="margin-bottom:10px;">Copy key</button>' +
    '<button class="btn primary block" type="button" id="authKeyContinue">I\'ve saved it — continue to dashboard</button>' +
  '</div>';
}
function wireAuthKeyConfirm(root) {
  on(qs("#authKeyCopy", root), "click", function () {
    var text = authKeyToShow.key;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast("Copied.", "ok"); }, function () { toast("Copy failed — select and copy manually.", "err"); });
  });
  on(qs("#authKeyContinue", root), "click", function () {
    authKeyToShow = null;
    renderAuthGate();
  });
}

function logout() {
  clearAuth();
  appStarted = false;
  renderAuthGate();
  toast("Logged out.", "info");
}

/* ---------------------------------------------------------------------
 * SECTION: topbar wiring, keyboard shortcuts, boot
 * ------------------------------------------------------------------- */
function syncBottomNav() {
  var order = ["overview", "orders", "simulator", "approvals"];
  qsa(".bn-item").forEach(function (el) {
    var r = el.getAttribute("data-nav");
    var active = r === "more" ? !order.includes(STATE.route) : STATE.route === r;
    el.classList.toggle("active", active);
  });
}

/** The real app shell — sidebar, topbar wiring, routing. Runs exactly once, only after renderAuthGate() confirms a JWT is present. */
function startApp() {
  renderSidebar();

  qsa('[data-nav]', document.body).forEach(function (el) {
    if (el.closest("#bottomnav")) on(el, "click", function (e) { e.preventDefault(); navigate(el.getAttribute("data-nav")); });
  });

  on(qs("#menuBtn"), "click", function () { STATE.sidebarOpen = !STATE.sidebarOpen; qs("#sidebar").classList.toggle("open", STATE.sidebarOpen); });
  on(qs("#cmdkBtn"), "click", openCmdk);
  on(qs("#avatarBtn"), "click", function () { navigate("settings"); });

  var notifOpen = false;
  on(qs("#notifBtn"), "click", function (e) {
    e.stopPropagation(); notifOpen = !notifOpen;
    qs("#notifPanel").classList.toggle("open", notifOpen);
    if (notifOpen) renderNotifPanel();
  });
  document.addEventListener("click", function (e) {
    if (notifOpen && !e.target.closest("#notifPanel") && !e.target.closest("#notifBtn")) { notifOpen = false; qs("#notifPanel").classList.remove("open"); }
  });

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (qs("#cmdk").classList.contains("open")) closeCmdk(); else openCmdk(); }
  });

  function checkMobile() {
    var isMobile = window.innerWidth <= 860;
    qs("#menuBtn").style.display = isMobile ? "flex" : "none";
    if (!isMobile) { qs("#sidebar").classList.remove("open"); }
  }
  window.addEventListener("resize", debounce(checkMobile, 150));
  checkMobile();

  var route = (location.hash.replace("#/", "").split("/")[0]) || "overview";
  STATE.route = route;
  STATE.routeParam = location.hash.replace("#/", "").split("/")[1];
  renderRoute();
  syncBottomNav();
  var origRenderRoute = renderRoute;
  renderRoute = function () { origRenderRoute(); syncBottomNav(); };

  checkConnection(true).then(function () { if (STATE.route === "overview" || STATE.route === "dev-logs") renderRoute(); });

  if (!STATE.onboarded) { setTimeout(openOnboarding, 500); }
}

/** Real entry point. Shows the login/signup gate first; startApp() only runs once a real JWT exists (see renderAuthGate). */
function boot() {
  var m = location.hash.match(/^#\/reset-password\/(.+)$/);
  if (m && m[1]) {
    pendingResetToken = decodeURIComponent(m[1]);
    authTab = "reset";
    history.replaceState(null, "", location.pathname + location.search); // scrub the token out of the visible URL/history
    clearAuth(); // a reset link always lands on the reset form, even if this browser has a stale session
  }
  renderAuthGate();
}

document.addEventListener("DOMContentLoaded", boot);
if (document.readyState !== "loading") boot();
</script>
</body>
