<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-COS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  /* Single fixed theme — bright, elegant, professional. A cohesive
     indigo + violet + amber palette on a crisp cool-white ground:
     indigo for commerce actions & navigation, violet for the AI agent's
     own voice, amber for "needs a human" and brand accents, emerald for
     money actually moved, rose for blocked/failed, gray = inactive.
     No dark mode. */
  :root {
    color-scheme: light;
    --bg: #f8f9fd;
    --surface: #ffffff;
    --surface-2: #f0f1f9;
    --border: #e3e5f2;
    --border-strong: #c9cce3;
    --text: #14162b;
    --text-soft: #5b5f79;
    /* #63677e, not the original #9498ad — that shade sits at ~2.7:1 on this
       background (fails WCAG AA's 4.5:1 for body text); this hits ~5.3:1
       while staying visually "faint" relative to --text/--text-soft. */
    --text-faint: #63677e;

    /* Indigo — primary commerce actions & navigation */
    --primary: #4f46e5;
    --primary-ink: #3730a3;
    --primary-soft: #eef0ff;
    --primary-surface: #f6f7ff;

    /* Violet — the AI agent's own voice */
    --agent: #7c3aed;
    --agent-ink: #6423cf;
    --agent-soft: #f3ecfe;

    /* Amber — brand accents & "needs a human" */
    --brand-yellow: #f59e0b;
    --brand-yellow-ink: #b45309;
    --brand-yellow-soft: #fef6e7;

    /* Darkened from the original #059669/#e11d48: on their own -soft chips
       those sat at 3.4:1 / 4.1:1, under WCAG AA's 4.5:1 for text. These pass
       (~4.9:1 / ~5.1:1) while reading as the same green/rose family; white
       text on the solid button/icon fills gets a touch more contrast too. */
    --success: #047a56;
    --success-soft: #e6f8f1;
    --warning: #f59e0b;
    --warning-soft: #fef6e7;
    --danger: #c81440;
    --danger-soft: #fdecf0;

    --cat-1: #4f46e5; /* ACP — indigo */
    --cat-2: #7c3aed; /* AP2 — violet */
    --cat-3: #0d9488; /* x402 — teal */
    --cat-4: #f59e0b; /* UAP — amber */

    --shadow-sm: 0 1px 2px rgba(20,22,60,0.06);
    --shadow-md: 0 8px 24px -12px rgba(30,27,75,0.16);
    --shadow-lg: 0 24px 60px -20px rgba(30,27,75,0.26);
    --radius: 14px;
    --radius-sm: 9px;

    /* Deep indigo/violet sidebar — the one place the palette goes rich and
       dark rather than tinted-white, so the app reads as designed rather
       than "default light theme." Text/border tokens here are pre-mixed
       for contrast against that dark ground, not derived from --text. */
    --sidebar-bg-1: #1c1533;
    --sidebar-bg-2: #241a42;
    --sidebar-border: rgba(255,255,255,0.08);
    --sidebar-text: rgba(237,235,250,0.92);
    --sidebar-text-soft: rgba(210,206,235,0.62);
    /* 0.58 alpha, not a fainter value — this text (group labels, the
       sidebar tagline, default nav-icon color) still needs to clear 4.5:1;
       0.58 lands at ~4.65:1 on --sidebar-bg-1. */
    --sidebar-text-faint: rgba(210,206,235,0.58);
    --sidebar-active-bg: rgba(129,120,255,0.22);
    --sidebar-active-ink: #c9c3ff;
    --sidebar-hover-bg: rgba(255,255,255,0.06);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    /* A flat --bg fill read as "just white" — this keeps the same very
       light base but washes in faint brand-color radial glows behind the
       cards, so the canvas has some depth without touching text contrast. */
    background:
      radial-gradient(1100px 550px at 12% -8%, rgba(79,70,229,0.07), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(245,158,11,0.05), transparent 55%),
      radial-gradient(800px 500px at 50% 100%, rgba(124,58,237,0.04), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .num { font-variant-numeric: tabular-nums; }
  a { color: var(--primary); }
  h1,h2,h3,h4 { margin: 0; font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 13.5px; color: var(--text); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  svg { display: block; }

  /* ---------- App shell ---------- */
  #shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  #sidebar {
    background: linear-gradient(180deg, var(--sidebar-bg-1) 0%, var(--sidebar-bg-2) 55%, var(--sidebar-bg-1) 100%);
    border-right: 1px solid var(--sidebar-border);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 18px 18px 14px; }
  .brand .mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--agent) 55%, var(--brand-yellow) 100%);
    color: #fff; box-shadow: 0 2px 8px -1px rgba(79,70,229,0.55);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex: none;
  }
  .brand .name { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: -0.01em; color: var(--sidebar-text); }
  .brand .tag { font-size: 10.5px; color: var(--sidebar-text-faint); letter-spacing: 0.04em; text-transform: uppercase; margin-top: -1px; }

  nav.navgroups { flex: 1; padding: 6px 10px; overflow-y: auto; }
  .navgroup { margin-bottom: 4px; }
  .navgroup-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--sidebar-text-faint); padding: 14px 10px 6px;
  }
  .navitem {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm);
    color: var(--sidebar-text-soft); font-size: 13.3px; font-weight: 500; text-decoration: none;
    border: 1px solid transparent; cursor: pointer; transition: background .12s ease, color .12s ease;
  }
  .navitem:hover { background: var(--sidebar-hover-bg); color: var(--sidebar-text); }
  .navitem.active {
    background: var(--sidebar-active-bg); color: #fff; font-weight: 600;
    box-shadow: inset 3px 0 0 var(--brand-yellow);
  }
  .navitem .ic { width: 16px; height: 16px; flex: none; opacity: 0.9; }
  .navitem .count {
    margin-left: auto; font-size: 10.5px; font-weight: 700; background: var(--danger); color: #fff;
    border-radius: 100px; padding: 1px 6px;
  }
  .sidebar-foot { border-top: 1px solid var(--sidebar-border); padding: 10px; display: flex; flex-direction: column; gap: 2px; }

  /* ---------- Topbar ---------- */
  #main { display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    height: 58px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #ffffff 0%, var(--primary-surface) 100%);
    position: sticky; top: 0; z-index: 20; gap: 16px;
  }
  .topbar-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .topbar-left h1 { font-size: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb { font-size: 12.5px; color: var(--text-faint); white-space: nowrap; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; justify-content: center; color: var(--text-soft); position: relative;
    box-shadow: var(--shadow-sm);
    transition: border-color .12s ease, background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); box-shadow: var(--shadow-md); }
  .icon-btn .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  /* Touch/coarse-pointer devices get the full 44x44 minimum tap target
     (WCAG 2.5.5 / platform HIG); mouse users keep the tighter 38px that
     suits a dense desktop dashboard. */
  @media (pointer: coarse) {
    .icon-btn { width: 44px; height: 44px; }
  }

  /* ---------- Icon marks (replaces emoji-as-icon throughout) ---------- */
  .ic-svg { display: block; flex: none; }
  .bn-item .ic-svg { color: var(--text-faint); } /* bottom nav stays on the light surface, unlike the dark sidebar */
  .navitem .ic, #sidebarFoot .ic { color: var(--sidebar-text-faint); }
  .navitem.active .ic { color: var(--brand-yellow); }
  .navitem:hover .ic { color: var(--sidebar-text-soft); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--agent); color: #fff; font-weight: 700; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em;
    padding: 5px 10px; border-radius: 100px; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .pill-test { background: var(--brand-yellow-soft); color: var(--brand-yellow-ink); }
  .pill-test .dot { background: var(--brand-yellow); box-shadow: 0 0 0 2px var(--brand-yellow-soft); }
  .pill-live { background: var(--success-soft); color: var(--success); }
  .pill-live .dot { background: var(--success); }
  .pill-off { background: var(--surface-2); color: var(--text-faint); }
  .pill-off .dot { background: var(--text-faint); }
  .pill-danger { background: var(--danger-soft); color: var(--danger); }
  .pill-danger .dot { background: var(--danger); }

  #view { padding: 26px 30px 80px; max-width: 1280px; width: 100%; margin: 0 auto; }

  /* ---------- Generic components ---------- */
  .card {
    background: linear-gradient(180deg, #ffffff 0%, #fdfdff 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .card-pad { padding: 20px; }
  .row { display: flex; align-items: center; }
  .between { justify-content: space-between; }
  .gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-10 { gap: 10px; } .gap-14 { gap: 14px; } .gap-20 { gap: 20px; }
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } .grid-2 { grid-template-columns: 1fr; } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: linear-gradient(180deg, #ffffff 0%, var(--surface-2) 100%); color: var(--text);
    box-shadow: var(--shadow-sm);
    transition: border-color .12s ease, background .12s ease, transform .08s ease, box-shadow .12s ease;
  }
  .btn:hover { border-color: var(--border-strong); background: var(--surface-2); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn:active { transform: translateY(1px); box-shadow: var(--shadow-sm); }
  .btn:disabled { opacity: 0.5; cursor: default; pointer-events: none; transform: none; box-shadow: none; }
  .btn.primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--agent) 130%); border-color: var(--primary-ink); color: #fff;
    box-shadow: 0 2px 8px -1px rgba(79,70,229,0.4);
  }
  .btn.primary:hover { background: linear-gradient(135deg, var(--primary-ink) 0%, var(--agent-ink) 130%); border-color: var(--primary-ink); box-shadow: 0 8px 20px -4px rgba(79,70,229,0.48); }
  .btn.danger { background: linear-gradient(135deg, var(--danger) 0%, #94103a 130%); border-color: var(--danger); color: #fff; box-shadow: 0 2px 8px -1px rgba(200,20,64,0.38); }
  .btn.danger:hover { filter: brightness(1.08); box-shadow: 0 8px 20px -4px rgba(200,20,64,0.45); }
  .btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
  .btn.ghost:hover { background: var(--surface-2); transform: none; box-shadow: none; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn.block { width: 100%; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    padding: 3px 8px; border-radius: 6px;
  }
  .badge.ok { background: var(--success-soft); color: var(--success); }
  /* text is brand-yellow-ink, not --warning — --warning (#f59e0b) on
     --warning-soft is only 2:1, far under the 4.5:1 body-text minimum. */
  .badge.warn { background: var(--warning-soft); color: var(--brand-yellow-ink); }
  .badge.bad { background: var(--danger-soft); color: var(--danger); }
  .badge.neutral { background: var(--surface-2); color: var(--text-soft); }
  .badge.agent { background: var(--agent-soft); color: var(--agent); }
  .badge.primary { background: var(--primary-soft); color: var(--primary-ink); }

  .kpi-label { font-size: 12px; color: var(--text-soft); font-weight: 600; }
  .kpi-value { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi-delta { font-size: 12px; font-weight: 600; margin-top: 6px; }
  .kpi-delta.up { color: var(--success); } .kpi-delta.down { color: var(--danger); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--surface-2); }

  .check-list { display: flex; flex-direction: column; gap: 9px; }
  .check-item { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .check-item .ico { width: 17px; height: 17px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; font-size: 10.5px; font-weight: 800; }
  .check-item.pass .ico { background: var(--success-soft); color: var(--success); }
  .check-item.fail .ico { background: var(--danger-soft); color: var(--danger); }
  .check-item.pending .ico { background: var(--surface-2); color: var(--text-faint); }

  .divider { height: 1px; background: var(--border); border: none; margin: 16px 0; }
  .empty-state { text-align: center; padding: 54px 20px; color: var(--text-soft); }
  .empty-state h3 { font-size: 15px; margin-bottom: 6px; color: var(--text); }
  .empty-state p { max-width: 42ch; margin: 0 auto 16px; font-size: 13px; }

  .skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 6px; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  /* ---------- Toasts ---------- */
  #toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; max-width: 340px; }
  .toast {
    background: var(--text); color: var(--bg); border-radius: 9px; padding: 11px 14px; font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg); display: flex; align-items: flex-start; gap: 9px; animation: toastIn .18s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .toast.ok { border-left: 3px solid var(--success); } .toast.err { border-left: 3px solid var(--danger); } .toast.info { border-left: 3px solid var(--primary); }

  /* ---------- Modal ---------- */
  #modalRoot { position: fixed; inset: 0; z-index: 300; display: none; }
  #modalRoot.open { display: block; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(15,17,21,0.5); animation: fadeIn .12s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-panel {
    position: relative; max-width: 560px; width: calc(100% - 32px); margin: 6vh auto; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); animation: modalIn .16s ease;
  }
  .modal-panel.wide { max-width: 760px; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); border-radius: 14px 14px 0 0; }
  .modal-head h3 { font-size: 16px; }
  .modal-body { padding: 22px; }
  .modal-foot { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: var(--surface); border-radius: 0 0 14px 14px; }

  /* ---------- Command palette ---------- */
  #cmdk { position: fixed; inset: 0; z-index: 400; display: none; }
  #cmdk.open { display: block; }
  .cmdk-panel { position: relative; max-width: 560px; width: calc(100% - 32px); margin: 10vh auto 0; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .cmdk-input { width: 100%; border: none; border-bottom: 1px solid var(--border); padding: 16px 18px; font-size: 15px; background: transparent; color: var(--text); }
  .cmdk-list { max-height: 340px; overflow-y: auto; padding: 6px; }
  .cmdk-item { padding: 10px 12px; border-radius: 8px; font-size: 13.5px; display: flex; justify-content: space-between; cursor: pointer; }
  .cmdk-item.sel { background: var(--primary-soft); color: var(--primary-ink); }
  .cmdk-item span.k { font-size: 11px; color: var(--text-faint); }

  /* ---------- Notification panel ---------- */
  #notifPanel { position: absolute; top: 52px; right: 22px; width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 120; display: none; max-height: 400px; overflow-y: auto; }
  #notifPanel.open { display: block; }
  .notif-item { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .notif-item:hover { background: var(--surface-2); }
  .notif-item:last-child { border-bottom: none; }

  /* ---------- Buyer simulator ---------- */
  .sim-grid { display: grid; grid-template-columns: 1fr 380px; gap: 18px; align-items: start; }
  @media (max-width: 980px) { .sim-grid { grid-template-columns: 1fr; } }
  .chat-log { display: flex; flex-direction: column; gap: 12px; padding: 18px; min-height: 360px; max-height: 520px; overflow-y: auto; }
  .bubble { max-width: 80%; padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; }
  .bubble.buyer { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 3px; }
  .bubble.acos { align-self: flex-start; background: var(--agent-soft); color: var(--text); border-bottom-left-radius: 3px; border-left: 3px solid var(--agent); padding-left: 10px; }
  .bubble.system { align-self: center; background: transparent; color: var(--text-faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  .product-card-mini { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 6px; }
  .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .chat-input-row input { flex: 1; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; background: var(--bg); }
  .suggest-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 12px; }
  .suggest-chip { font-size: 12px; border: 1px solid var(--border); border-radius: 100px; padding: 5px 11px; color: var(--text-soft); background: var(--surface); }
  .suggest-chip:hover { border-color: var(--primary); color: var(--primary); }

  .auth-line { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; }
  .auth-line.total { font-weight: 700; font-size: 15px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
  .headroom-bar { height: 7px; border-radius: 100px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
  .headroom-fill { height: 100%; background: var(--primary); border-radius: 100px; transition: width .3s ease; }
  .headroom-fill.over { background: var(--danger); }

  /* ---------- Money hero: the one number that matters most on a screen ---------- */
  .money-hero { margin-bottom: 16px; }
  .money-hero .mh-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
  .money-hero .mh-amount { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .money-hero .mh-sub { font-size: 12.5px; color: var(--text-soft); margin-top: 4px; }

  /* ---------- Verdict hero: the risk decision, unmissable ---------- */
  .verdict-hero { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 12px; border: 1.5px solid; margin-bottom: 16px; }
  .verdict-hero .vh-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex: none; }
  .verdict-hero .vh-label { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .verdict-hero .vh-sub { font-size: 12.5px; margin-top: 2px; opacity: 0.85; }
  .verdict-hero.ok { background: var(--success-soft); border-color: var(--success); color: var(--success); }
  .verdict-hero.ok .vh-icon { background: var(--success); color: #fff; }
  .verdict-hero.warn { background: var(--warning-soft); border-color: var(--warning); color: var(--brand-yellow-ink); }
  .verdict-hero.warn .vh-icon { background: var(--warning); color: var(--brand-yellow-ink); } /* white-on-amber here was ~2.1:1 */
  .verdict-hero.bad { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .verdict-hero.bad .vh-icon { background: var(--danger); color: #fff; }
  .verdict-hero.enter { animation: verdictIn .38s cubic-bezier(.2,.8,.3,1.15) both; }
  @keyframes verdictIn { from { opacity: 0; transform: translateY(-4px) scale(.97); } to { opacity: 1; transform: none; } }
  .verdict-hero.bad.shake { animation: verdictIn .38s cubic-bezier(.2,.8,.3,1.15) both, verdictShake .42s ease .38s; }
  @keyframes verdictShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .check-item.reveal { animation: checkReveal .3s ease both; }
  @keyframes checkReveal { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }

  /* ---------- Timeline (audit) ---------- */
  .timeline { position: relative; padding-left: 26px; }
  .timeline::before { content:""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
  .tl-item { position: relative; padding: 2px 8px 20px 0; margin-right: -8px; cursor: pointer; border-radius: 8px; transition: background .12s ease; }
  .tl-item:hover { background: var(--surface-2); }
  .tl-item::before { content:""; position: absolute; left: -26px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 2px solid var(--primary); z-index: 1; }
  .tl-item.fail::before { border-color: var(--danger); }
  .tl-item.pending::before { border-color: var(--warning); }
  .tl-item .tl-time { font-size: 11px; color: var(--text-faint); }
  .tl-item .tl-action { font-weight: 600; font-size: 13.5px; margin-top: 2px; }
  .tl-item .tl-detail { font-size: 12px; color: var(--text-soft); margin-top: 4px; }
  .tl-item .tl-hash { font-size: 10.5px; color: var(--text-faint); margin-top: 5px; }
  .tl-item.new-entry { animation: tlEntryIn .42s cubic-bezier(.2,.8,.3,1.1); }
  @keyframes tlEntryIn { from { opacity: 0; transform: translateY(-10px); background: var(--primary-soft); } 60% { background: var(--primary-soft); } to { opacity: 1; transform: none; background: transparent; } }
  .tl-item.verifying::before { animation: tlPulse .5s ease; }
  @keyframes tlPulse { 0% { box-shadow: 0 0 0 0 var(--primary-soft); } 100% { box-shadow: 0 0 0 6px rgba(0,0,0,0); } }

  /* ---------- Audit hash hero (entry detail) ---------- */
  .hash-hero { background: var(--surface-2); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .hash-hero .hh-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 6px; }
  .hash-hero .hh-value { font-family: 'IBM Plex Mono', monospace; font-size: 15.5px; font-weight: 600; letter-spacing: 0.01em; word-break: break-all; color: var(--text); }
  .hash-chain-link { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 11px; color: var(--text-faint); }
  .hash-chain-link .mono { font-size: 11px; }

  /* ---------- Resolution flash (approvals) ---------- */
  .resolve-flash { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--surface); border-radius: 14px; z-index: 5; animation: flashIn .16s ease; }
  @keyframes flashIn { from { opacity: 0; } to { opacity: 1; } }
  .resolve-flash .rf-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; animation: flashPop .32s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes flashPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .resolve-flash .rf-label { font-size: 15px; font-weight: 700; }
  .resolve-flash.ok .rf-icon { background: var(--success-soft); color: var(--success); }
  .resolve-flash.ok .rf-label { color: var(--success); }
  .resolve-flash.bad .rf-icon { background: var(--danger-soft); color: var(--danger); }
  .resolve-flash.bad .rf-label { color: var(--danger); }

  .toast.warn { border-left: 3px solid var(--warning); }

  /* ---------- Nav toggles / switches ---------- */

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-soft); }
  .field input[type="text"], .field input[type="number"], .field input[type="email"], .field input[type="password"], .field select, .field textarea {
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; background: var(--surface); color: var(--text); width: 100%;
  }
  .field-hint { font-size: 11.5px; color: var(--text-faint); }

  /* ---------- Auth screen (signup / login gate) ---------- */
  #authScreen {
    position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center;
    background: var(--bg); padding: 20px;
  }
  #authScreen .auth-card { width: 100%; max-width: 400px; }
  #authScreen .auth-brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 22px; }
  #authScreen .auth-brand .mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: #fff; display: flex;
    align-items: center; justify-content: center; font-weight: 800; font-size: 16px;
  }
  #authScreen .auth-brand .name { font-weight: 800; font-size: 16px; }
  #authScreen .auth-brand .tag { font-size: 11px; color: var(--text-faint); }
  #authScreen .auth-tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 18px; }
  #authScreen .auth-tab {
    flex: 1; text-align: center; padding: 8px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-soft);
  }
  #authScreen .auth-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  #authScreen .auth-error {
    background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 12px; display: none;
  }
  #authScreen .auth-error.show { display: block; }
  #authScreen .auth-keybox {
    background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 8px; padding: 12px; margin: 10px 0 16px; font-size: 12px;
  }
  #authScreen .auth-keybox .key { font-family: monospace; font-size: 12px; word-break: break-all; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-top: 8px; }
  .checkline { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 0; }

  /* ---------- Console output ---------- */
  .out-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word;
    min-height: 140px; max-height: 340px; overflow-y: auto; color: var(--text-soft);
  }
  .out-box .line { display: block; margin-bottom: 2px; }
  .out-box .ok { color: var(--success); }
  .out-box .err { color: var(--danger); }

  /* ---------- Mobile ---------- */
  #bottomnav { display: none; }
  @media (max-width: 860px) {
    #shell { grid-template-columns: 1fr; }
    #sidebar { display: none; }
    /* The topbar was overflowing the viewport on phone widths (title +
       crumb + TEST MODE pill + connection pill + 3 icon buttons all in one
       row, none of them allowed to shrink) — that pushed the whole page
       into horizontal scroll. Drop the two lowest-value pieces (breadcrumb
       and the connection-status pill; both are redundant with page copy
       elsewhere) and tighten spacing instead of letting anything clip. */
    #topbar { padding: 0 12px; gap: 8px; }
    .topbar-left { min-width: 0; flex: 1 1 auto; }
    .topbar-left .crumb, #connPill { display: none; }
    .topbar-right { gap: 6px; }
    #sidebar.open { display: flex; position: fixed; inset: 0 20% 0 0; z-index: 250; height: 100vh; box-shadow: var(--shadow-lg); }
    #bottomnav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 58px; background: var(--surface);
      border-top: 1px solid var(--border); z-index: 90; justify-content: space-around; align-items: center;
    }
    .bn-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 10px; color: var(--text-faint); font-weight: 600;
      min-width: 44px; min-height: 44px; flex: 1;
    }
    .bn-item.active { color: var(--primary); }
    #view { padding: 18px 16px 90px; }
    .sim-grid { grid-template-columns: 1fr; }
    /* Responsive tables reflow into a stack of labeled rows instead of
       vanishing — thead is hidden, each cell keeps its column label via
       data-label so the data doesn't lose context without headers. */
    table.responsive thead { display: none; }
    table.responsive, table.responsive tbody, table.responsive tr { display: block; width: 100%; }
    table.responsive tr {
      border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 10px; padding: 6px 12px; background: var(--surface);
    }
    table.responsive td {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      border: none; border-bottom: 1px solid var(--border); padding: 8px 0; text-align: right; white-space: normal;
    }
    table.responsive td:last-child { border-bottom: none; }
    table.responsive td[data-label]::before {
      content: attr(data-label); font-size: 11px; font-weight: 600; color: var(--text-faint); text-align: left; flex: none; margin-right: auto;
    }
  }
</style>
</head>

<script>
"use strict";
/* ==================================================================== */
/* A-COS APPLICATION                                                     */

/* ---------------------------------------------------------------------
 * SECTION: constants + demo data
 * All figures here are the SAME catalog/pricing used by the real backend
 * (src/data/catalog.ts) so the demo and a connected live server agree.
 * ------------------------------------------------------------------- */

var REAL_ENDPOINTS = [
  { method: "GET", path: "/health", desc: "Liveness check for the A-COS server." },
  { method: "GET", path: "/agent/v1/catalog", desc: "Full catalog as Schema.org/Commerce JSON-LD." },
  { method: "GET", path: "/agent/v1/catalog/search", desc: "Search catalog by query/category/max price." },
  { method: "GET", path: "/agent/v1/catalog/quote/:sku", desc: "Issue a 120s price quote for a SKU." },
  { method: "GET", path: "/agent/v1/catalog/inventory/:sku", desc: "Live inventory for a SKU." },
  { method: "POST", path: "/agent/v1/checkout", desc: "Bridge an ACP/AP2/x402/NPCI-UAP mandate into a Razorpay order." },
  { method: "POST", path: "/agent/v1/cart/recommendations", desc: "Bundle/upsell recommendations for a cart." },
  { method: "POST", path: "/agent/v1/negotiate", desc: "Evaluate a buyer counter-offer against the margin guardrail." },
  { method: "POST", path: "/agent/v1/checkout/simulate-failure", desc: "Deterministic price-drift mandate-breach demo." },
  { method: "GET", path: "/agent/v1/audit/:intentId", desc: "Audit trail for one intent." },
  { method: "GET", path: "/agent/v1/audit", desc: "Full server-side audit log." },
  { method: "GET", path: "/agent/v1/audit/verify-chain", desc: "Verify the server's hash chain is intact." }
];

var MCP_TOOLS = [
  { name: "search_catalog", desc: "Search the merchant catalog by free-text query, category, max price.", real: true },
  { name: "get_product_quote", desc: "Issue a short-lived (120s) price quote for a SKU.", real: true },
  { name: "check_inventory", desc: "Check live stock for a SKU and requested quantity.", real: true }
];

var DEMO_CATALOG = [
  { sku: "SKU-HEADPHONE-700", name: "Aurora Wireless Headphones", category: "Electronics > Audio", mcc: "5732",
    price: 700, compareAt: 899, stock: 24, reserved: 3, aiDemand: "high", margin: 28,
    desc: "Wireless over-ear ANC headphones suitable for travel and everyday listening. 40h battery.",
    aiDiscoverable: true, aiPurchasable: true, aiNegotiable: true, maxDiscount: 10,
    recommendedWith: ["SKU-CASE-199", "SKU-CABLE-99"], rating: 4 },
  { sku: "SKU-CASE-199", name: "Aurora Travel Case", category: "Electronics > Accessories", mcc: "5732",
    price: 199, compareAt: 249, stock: 65, reserved: 0, aiDemand: "medium", margin: 45,
    desc: "Hard-shell carrying case sized for Aurora Headphones.",
    aiDiscoverable: true, aiPurchasable: true, aiNegotiable: true, maxDiscount: 10,
    recommendedWith: ["SKU-HEADPHONE-700"], rating: 4 },
  { sku: "SKU-CABLE-99", name: "USB-C Braided Cable (1.5m)", category: "Electronics > Accessories", mcc: "5732",
    price: 99, compareAt: 129, stock: 210, reserved: 0, aiDemand: "medium", margin: 60,
    desc: "Fast-charge braided USB-C cable, 1.5m.",
    aiDiscoverable: true, aiPurchasable: true, aiNegotiable: true, maxDiscount: 15,
    recommendedWith: [], rating: 5 },
  { sku: "SKU-SPEAKER-2499", name: "Nimbus Portable Speaker", category: "Electronics > Audio", mcc: "5732",
    price: 2499, compareAt: 2799, stock: 2, reserved: 1, aiDemand: "high", margin: 22,
    desc: "IPX7 waterproof Bluetooth speaker, 20h battery.",
    aiDiscoverable: true, aiPurchasable: true, aiNegotiable: false, maxDiscount: 0,
    recommendedWith: ["SKU-CABLE-99"], rating: 4 },
  { sku: "SKU-STAND-349", name: "Adjustable Desk Phone Stand", category: "Electronics > Accessories", mcc: "5732",
    price: 349, compareAt: 349, stock: 40, reserved: 0, aiDemand: "low", margin: 50,
    desc: "Aluminium adjustable stand, foldable.",
    aiDiscoverable: true, aiPurchasable: true, aiNegotiable: true, maxDiscount: 10,
    recommendedWith: ["SKU-CABLE-99"], rating: 4 }
];

/**
 * Offline (demo-mode) mirror of growth.ts's baseline acceptance model —
 * same formula (15 + margin/5, clamped 10-35%; ×150 assumed monthly
 * carts; ×0.15 conversion factor) so SIMULATED numbers aren't arbitrary,
 * they're the same math the live backend runs, just without real
 * impression/acceptance samples to blend in yet.
 */
function demoRecommendations() {
  var reasons = {
    "SKU-HEADPHONE-700>SKU-CASE-199": "Frequently bought with Aurora Headphones — protects during travel.",
    "SKU-HEADPHONE-700>SKU-CABLE-99": "Spare fast-charge cable for the headphone case's USB-C port.",
    "SKU-CASE-199>SKU-HEADPHONE-700": "This case is sized for Aurora Headphones.",
    "SKU-SPEAKER-2499>SKU-CABLE-99": "Nimbus Speaker charges via USB-C — a spare cable is commonly added.",
    "SKU-STAND-349>SKU-CABLE-99": "Frequently purchased together for a desk setup."
  };
  var out = [];
  DEMO_CATALOG.forEach(function (primary) {
    (primary.recommendedWith || []).forEach(function (companionSku) {
      var companion = DEMO_CATALOG.find(function (p) { return p.sku === companionSku; });
      if (!companion) return;
      var rate = Math.round(Math.min(35, Math.max(10, 15 + companion.margin / 5)));
      out.push({
        primary_sku: primary.sku, primary_name: primary.name,
        companion_sku: companion.sku, companion_name: companion.name,
        companion_price_inr: companion.price,
        reason: reasons[primary.sku + ">" + companion.sku] || "Frequently purchased together.",
        enabled: true, confidence: "ESTIMATED", impressions: 0, acceptances: 0,
        acceptance_rate_pct: rate,
        expected_incremental_revenue_inr: Math.round((rate / 100) * 150 * companion.price),
        expected_conversion_impact_pct: Math.round(rate * 0.15 * 10) / 10,
        expected_margin_inr: Math.round(companion.price * (companion.margin / 100)),
        inventory_available: companion.stock,
        inventory_note: companion.stock < 10 ? "Only " + companion.stock + " left — recommend cautiously" : companion.stock + " in stock"
      });
    });
  });
  return out.sort(function (a, b) { return b.expected_incremental_revenue_inr - a.expected_incremental_revenue_inr; });
}

/** Pure — takes the current (possibly toggled/created-in-session) recommendation and campaign lists so demo-mode Opportunities react to what the person just did, not a frozen snapshot. */
function demoOpportunities(recsList, campaignsList) {
  var activeSkus = {};
  (campaignsList || []).filter(function (c) { return c.status === "active"; }).forEach(function (c) { (c.product_skus || []).forEach(function (s) { activeSkus[s] = true; }); });
  return (recsList || [])
    .filter(function (r) { return r.enabled && r.acceptance_rate_pct >= 15 && !activeSkus[r.primary_sku] && !activeSkus[r.companion_sku]; })
    .slice(0, 4)
    .map(function (r) {
      return {
        opportunity_id: "opp_" + r.primary_sku + "_" + r.companion_sku,
        primary_sku: r.primary_sku, companion_sku: r.companion_sku,
        headline: r.acceptance_rate_pct + "% of " + r.primary_name + " carts also want " + r.companion_name,
        evidence: "Estimated from category margin baseline — no real recommendation traffic observed yet in demo mode.",
        confidence: "ESTIMATED",
        potential_monthly_revenue_inr: r.expected_incremental_revenue_inr,
        already_has_active_campaign: false,
        suggested_campaign: {
          name: r.companion_name + " bundle",

    { key: "checkout", label: "Conversational checkout enabled", status: "ok", weight: 5 }
  ];
  var max = checks.reduce(function (s, c) { return s + c.weight; }, 0);
  var score = checks.reduce(function (s, c) { return s + (c.status === "ok" ? c.weight : c.status === "warning" ? c.weight * 0.5 : 0); }, 0);
  return {
    score: Math.round((score / max) * 100),
    max_score: 100,
    checks: checks,
    blocking_count: checks.filter(function (c) { return c.status === "blocking"; }).length,
    warning_count: checks.filter(function (c) { return c.status === "warning"; }).length
  };
}

/* Hash-chained, tamper-evident client-side audit log. Real SHA-256 via
   WebCrypto — this genuinely verifies, it isn't a decorative timeline. */
var auditQueue = Promise.resolve();
function auditAppend(step, outcome, actor, reason, detail) {
  auditQueue = auditQueue.then(async function () {
    var prevHash = STATE.audit.length ? STATE.audit[STATE.audit.length - 1].hash : "0".repeat(64);
    var entry = {
      id: uid("audit"), step: step, outcome: outcome, actor: actor, reason: reason,
      detail: detail || {}, timestamp: new Date().toISOString(), prevHash: prevHash
    };
    var payload = JSON.stringify({ id: entry.id, step: step, outcome: outcome, actor: actor, reason: reason, detail: entry.detail, timestamp: entry.timestamp, prevHash: prevHash });
    entry.hash = await sha256Hex(payload);
    STATE.audit.push(entry);
    if (qs('[data-route-active="audit"]')) renderRoute();
    return entry;
  });
  return auditQueue;
}
async function verifyAuditChain() {
  var expected = "0".repeat(64);
  for (var i = 0; i < STATE.audit.length; i++) {
    var e = STATE.audit[i];
    if (e.prevHash !== expected) return { valid: false, brokenAt: e.id };
    var payload = JSON.stringify({ id: e.id, step: e.step, outcome: e.outcome, actor: e.actor, reason: e.reason, detail: e.detail, timestamp: e.timestamp, prevHash: e.prevHash });
    var recomputed = await sha256Hex(payload);
    if (recomputed !== e.hash) return { valid: false, brokenAt: e.id };
    expected = e.hash;
  }
  return { valid: true };
}

/* ---------------------------------------------------------------------
 * SECTION: API client — real fetch to configured base, with a demo
 * fallback layer. Every call is logged to STATE.requestHistory so
 * Developer Tools has a genuine request log, not a fake one.
 *
 * Credential routing: the backend has TWO separate credential types.
 *   - Agent API key (x-api-key) — for the agent-facing storefront surface
 *     an AI shopping agent would actually call: catalog, checkout,
 *     cart/recommendations, negotiate. The Buyer/Agent Simulator and Dev
 *     Tools "run as the agent" panels exercise these.
 *   - Dashboard JWT (Authorization: Bearer) — for every merchant-management
 *     call (sessions, growth, approvals, refunds, payment links, webhooks,
 *     policy, agents, campaigns, audit, test lab, dev/simulate-payment).
 * AGENT_KEY_PREFIXES below mirrors the backend's route table exactly
 * (src/server.ts) — if a new agent-facing route is added there, add its
 * prefix here too.
 * ------------------------------------------------------------------- */
var AGENT_KEY_PREFIXES = ["/agent/v1/catalog", "/agent/v1/checkout", "/agent/v1/cart/recommendations", "/agent/v1/negotiate"];
var PUBLIC_PATHS = ["/health", "/auth/signup", "/auth/login", "/auth/forgot-password", "/auth/reset-password", "/agent/v1/catalog/openapi.json"];
function pathNeedsAgentKey(path) { return AGENT_KEY_PREFIXES.some(function (p) { return path.indexOf(p) === 0; }); }
function pathIsPublic(path) { return PUBLIC_PATHS.indexOf(path) !== -1; }

async function apiFetch(path, opts) {
  var base = STATE.apiBase.replace(/\/+$/, "");
  var controller = new AbortController();
  var timer = setTimeout(function () { controller.abort(); }, 6000);
  var t0 = performance.now();
  var requestId = uid("req");
  var entry = { requestId: requestId, method: (opts && opts.method) || "GET", path: path, time: nowStr(), status: null, ok: false, latencyMs: null };

  var headers = Object.assign({}, opts && opts.headers);
  if (!pathIsPublic(path)) {
    if (pathNeedsAgentKey(path)) {
      if (STATE.apiKey) headers["x-api-key"] = STATE.apiKey;
    } else if (STATE.jwt) {
      headers["Authorization"] = "Bearer " + STATE.jwt;
    }
  }
  var fetchOpts = Object.assign({ signal: controller.signal }, opts || {}, { headers: headers });

  try {
    var res = await fetch(base + path, fetchOpts);
    clearTimeout(timer);
    entry.latencyMs = Math.round(performance.now() - t0);
    var body = null;
    try { body = await res.json(); } catch (e) {}
    entry.status = res.status; entry.ok = res.ok; entry.body = body;
    STATE.requestHistory.unshift(entry);
    if (STATE.requestHistory.length > 200) STATE.requestHistory.length = 200;
    if (res.status === 401 && !pathIsPublic(path) && STATE.jwt) {
      // The dashboard session is no longer valid (expired/rotated-out JWT).
      // Bounce back to the login screen rather than showing a dashboard full
      // of failed requests.
      handleSessionExpired();
    }
    return { ok: res.ok, status: res.status, body: body, requestId: requestId };
  } catch (err) {
    clearTimeout(timer);
    entry.latencyMs = Math.round(performance.now() - t0);
    entry.status = 0; entry.ok = false; entry.networkError = true;
    STATE.requestHistory.unshift(entry);
    if (STATE.requestHistory.length > 200) STATE.requestHistory.length = 200;
    return { ok: false, status: 0, body: null, networkError: true, requestId: requestId };
  }
}

var sessionExpiredHandled = false;
function handleSessionExpired() {
  if (sessionExpiredHandled) return;
  sessionExpiredHandled = true;
  clearAuth();
  renderAuthGate();
  toast("Your session expired — please log in again.", "warn");
  setTimeout(function () { sessionExpiredHandled = false; }, 1000);
}

/* ---------------------------------------------------------------------
 * SECTION: policy engine — the SAME function drives the Buyer Simulator's
 * live checklist, the Policy Simulator, and Order Detail's explainability
 * panel. One engine, reused everywhere, so the checkmarks on screen are
 * computed, never hardcoded.
 * ------------------------------------------------------------------- */
function categoryAllowed(category, policy) {
  if (/electronics/i.test(category) && !/accessor/i.test(category)) return !!policy.categories["Electronics"];
  if (/accessor/i.test(category)) return !!policy.categories["Accessories"];
  if (/gift/i.test(category)) return !!policy.categories["Gift card"] || !!policy.categories["Gift cards"];
  return true;
}

function evaluatePolicy(cart) {
  var policy = STATE.policy;
  var checks = [];
  var subtotal = 0, discountTotal = 0, totalQty = 0;

  cart.items.forEach(function (it) {
    var lineBase = it.price * it.qty;
    var lineDiscount = lineBase * ((it.discountPct || 0) / 100);
    subtotal += lineBase;
    discountTotal += lineDiscount;
    totalQty += it.qty;
  });
  var total = Math.round(subtotal - discountTotal);

  // 1. Quote valid
  var quoteOk = cart.quoteValid !== false;
  checks.push({ key: "quote", label: "Quote valid", pass: quoteOk, detail: quoteOk ? "Price locked within the quote window." : "Quote has expired — price must be refreshed." });

  // 2. Inventory confirmed
  var invOk = cart.items.every(function (it) {
    var p = findProduct(it.sku);
    return !p || (p.stock - p.reserved) >= it.qty;
  });
  checks.push({ key: "inventory", label: "Inventory confirmed", pass: invOk, detail: invOk ? "All items in stock." : "Requested quantity exceeds available stock." });

  // 3. Category permitted
  var catOk = cart.items.every(function (it) {
    var p = findProduct(it.sku);
    return !p || categoryAllowed(p.category, policy);
  });
  checks.push({ key: "category", label: "Category permitted", pass: catOk, detail: catOk ? "All categories allowed by policy." : "One or more items fall outside allowed categories." });

  // 4. Quantity within policy
  var qtyOk = totalQty <= policy.maxQty;
  checks.push({ key: "quantity", label: "Quantity within limit", pass: qtyOk, detail: qtyOk ? ("Qty " + totalQty + " ≤ max " + policy.maxQty + ".") : ("Qty " + totalQty + " exceeds max " + policy.maxQty + " per order.") });

  // 5. Discount policy satisfied
  var maxLineDiscountPct = cart.items.reduce(function (m, it) { return Math.max(m, it.discountPct || 0); }, 0);
  var discOk = maxLineDiscountPct <= policy.maxDiscountPct && discountTotal <= policy.maxDiscountAmt;
  checks.push({ key: "discount", label: "Discount policy satisfied", pass: discOk, detail: discOk ? (maxLineDiscountPct + "% ≤ max " + policy.maxDiscountPct + "%.") : ("Requested " + maxLineDiscountPct + "% exceeds max " + policy.maxDiscountPct + "% or ₹" + policy.maxDiscountAmt + " cap.") });

  // 6. AI authorization valid (buyer's own mandate limit)
  var authLimit = cart.authLimit != null ? cart.authLimit : policy.maxAutoOrder;
  var authOk = total <= authLimit;
  checks.push({ key: "auth", label: "AI authorization valid", pass: authOk, detail: authOk ? (inr(total) + " ≤ " + inr(authLimit) + " authorization.") : (inr(total) + " exceeds " + inr(authLimit) + " authorization.") });

  // 7. Merchant spending cap (platform-wide auto-approve ceiling)
  var capOk = total <= policy.maxAutoOrder;
  checks.push({ key: "cap", label: "Merchant spending cap satisfied", pass: capOk, detail: capOk ? (inr(total) + " ≤ " + inr(policy.maxAutoOrder) + " auto-approve cap.") : (inr(total) + " exceeds " + inr(policy.maxAutoOrder) + " auto-approve cap.") });

  var allPass = checks.every(function (c) { return c.pass; });
  var needsHuman = allPass && total > policy.humanApprovalAbove;

  var verdict = !allPass ? "BLOCKED" : (needsHuman ? "REQUIRES_HUMAN" : "APPROVED");
  var failed = checks.filter(function (c) { return !c.pass; });
  var reason = verdict === "APPROVED" ? "All policy checks passed automatically."
    : verdict === "REQUIRES_HUMAN" ? (inr(total) + " exceeds the ₹" + policy.humanApprovalAbove + " auto-approval threshold — routed for human review.")
    : failed.map(function (c) { return c.detail; }).join(" ");

  return { checks: checks, subtotal: Math.round(subtotal), discount: Math.round(discountTotal), total: total, authLimit: authLimit, verdict: verdict, reason: reason, qty: totalQty };
}

function statCard(label, value, delta, deltaUp) {

var chartSeq = 0;
/* Single-series line+area chart with a real crosshair+tooltip (dataviz-skill
   compliant: thin 2px line, rounded end, one hue, hover layer by default). */
function lineChart(values, opts) {
  opts = opts || {};
  var id = "lc" + (chartSeq++);
  var w = 100, h = 34; // viewBox units; scales via CSS width
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var range = (max - min) || 1;
  var pad = 3;
  var pts = values.map(function (v, i) {
    var x = pad + (i / (values.length - 1)) * (w - pad * 2);
    var y = h - pad - ((v - min) / range) * (h - pad * 2);
    return [x, y];
  });
  var pathD = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + p[0].toFixed(2) + "," + p[1].toFixed(2); }).join(" ");
  var areaD = pathD + " L" + pts[pts.length - 1][0].toFixed(2) + "," + h + " L" + pts[0][0].toFixed(2) + "," + h + " Z";
  var color = opts.color || "var(--primary)";
  var fmt = opts.fmt || function (v) { return v; };
  var dataAttr = esc(JSON.stringify({ values: values, labels: opts.labels || null, fmt: opts.fmtKey || "num" }));
  return '<div class="chart-wrap" style="position:relative;">' +
    '<svg class="linechart" id="' + id + '" data-points="' + dataAttr + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%; height:' + (opts.height || 64) + 'px; overflow:visible;" role="img" aria-label="' + esc(opts.ariaLabel || "Trend line chart") + '">' +
      '<defs><linearGradient id="grad' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + color + '" stop-opacity="0.22"/><stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + areaD + '" fill="url(#grad' + id + ')" stroke="none"/>' +
      '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
      '<circle class="lc-dot" r="2.4" fill="' + color + '" style="display:none;"/>' +
      '<line class="lc-cross" x1="0" y1="0" x2="0" y2="' + h + '" stroke="var(--border-strong)" stroke-width="0.6" style="display:none;"/>' +
      '<rect class="lc-hitarea" x="0" y="0" width="' + w + '" height="' + h + '" fill="transparent"/>' +
    '</svg>' +
    '<div class="lc-tooltip mono" data-for="' + id + '" style="position:absolute; display:none; pointer-events:none; background:var(--text); color:var(--bg); font-size:11px; padding:4px 7px; border-radius:6px; white-space:nowrap; transform:translate(-50%,-125%); z-index:5;"></div>' +
  '</div>';
}
function initCharts(root) {
  qsa(".linechart", root).forEach(function (svg) {
    var meta; try { meta = JSON.parse(svg.getAttribute("data-points")); } catch (e) { return; }
    var values = meta.values;
    var tooltip = qs('.lc-tooltip[data-for="' + svg.id + '"]', root);
    var dot = qs(".lc-dot", svg), cross = qs(".lc-cross", svg), hit = qs(".lc-hitarea", svg);
    var w = 100, h = 34, pad = 3;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values), range = (max - min) || 1;
    function fmtV(v) { return meta.fmt === "inr" ? inr(v) : (meta.fmt === "pct" ? v + "%" : v); }
    on(hit, "mousemove", function (e) {
      var rect = svg.getBoundingClientRect();
      var relX = (e.clientX - rect.left) / rect.width;
      var i = Math.round(relX * (values.length - 1));
      i = Math.max(0, Math.min(values.length - 1, i));
      var x = pad + (i / (values.length - 1)) * (w - pad * 2);
      var y = h - pad - ((values[i] - min) / range) * (h - pad * 2);
      dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.style.display = "block";
      cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.style.display = "block";
      if (tooltip) {
        tooltip.style.display = "block";
        tooltip.style.left = (x / w * 100) + "%";
        tooltip.style.top = (y / h * 100) + "%";
        tooltip.textContent = fmtV(values[i]) + (meta.labels ? " · " + meta.labels[i] : "");
      }
    });
    on(hit, "mouseleave", function () { dot.style.display = "none"; cross.style.display = "none"; if (tooltip) tooltip.style.display = "none"; });
  });
}

/* ---------------------------------------------------------------------
 * SECTION: navigation config + router

/**
 * NAV is organized around what the product actually does — prove a
 * transaction is safe (Simulate), grow AI-driven revenue within policy

/**
 * "See it catch a bad transaction" — the single end-to-end proof of value
 * (spec Step 4). Not a canned animation: it runs the exact same
 * evaluatePolicy() the Buyer Simulator, Policy Simulator, and Order Detail
 * explainability panel all use, creates a real STATE.approvals entry, and
 * appends real hash-chained STATE.audit entries via auditAppend(). Four
 * panels, launched from one Overview button, ending with a link into the
 * real Audit Trail.
 */
function openProofScenario() {
  var stage = 0;
  var scriptedCart = {
    items: [{ sku: "SKU-SPEAKER-2499", name: "Nimbus Portable Speaker", price: 2499, qty: 1, discountPct: 0 }],
    authLimit: 1000,
    quoteValid: true
  };
  var result = null, approval = null, auditEntries = [];

  function render() {
    var title, body, foot;
    if (stage === 0) {
      title = "See it catch a bad transaction · 1 of 4";
      body =
        '<p style="font-size:13px; color:var(--text-soft); line-height:1.6; margin-bottom:14px;">AI agents will spend money on your store without a human clicking "confirm." This runs one scripted checkout attempt through the real policy engine so you can watch what happens when an agent tries to spend past what it\'s authorized for.</p>' +
        '<div class="card card-pad" style="background:var(--surface-2);">' +
          '<div class="row between"><b style="font-size:13px;">Scripted attempt</b>' + dataSourceTag(true) + '</div>' +
          '<div style="font-size:12.5px; color:var(--text-soft); margin-top:8px;">Agent #201 attempts to buy <b>Nimbus Portable Speaker</b> — ' + inr(2499) + '</div>' +
          '<div style="font-size:12.5px; color:var(--text-soft); margin-top:4px;">This agent is authorized up to ' + inr(1000) + ' per transaction.</div>' +
        '</div>';
      foot = '<button class="btn" data-close="1">Cancel</button><button class="btn primary" id="pf_next">Run it</button>';
    } else if (stage === 1) {
      result = result || evaluatePolicy(scriptedCart);
      title = "Policy engine evaluates · 2 of 4";
      // The checks reveal in sequence (they're the evidence), then the
      // verdict lands last and dominant (it's the answer) — this is the
      // one moment the whole product exists to show, so the motion here
      // is deliberate: watch the checks fail, then feel the block land.
      body =
        '<div class="check-list" style="margin-bottom:16px;">' +
        result.checks.map(function (c, i) {
          return '<div class="check-item reveal ' + (c.pass ? "pass" : "fail") + '" style="animation-delay:' + (i * 70) + 'ms;"><span class="ico">' + (c.pass ? "✓" : "✕") + '</span><span style="flex:1;">' + esc(c.label) + '</span></div>';
        }).join("") +
        '</div>' +
        verdictHeroHtml(result.verdict, inr(result.total) + " — " + result.reason, { animate: true, delayMs: result.checks.length * 70 + 120 });
      foot = '<button class="btn" data-close="1">Cancel</button><button class="btn primary" id="pf_next">Continue</button>';
    } else if (stage === 2) {
      if (!approval) {
        approval = { id: uid("appr"), kind: "limit", title: inr(result.total) + " purchase — Nimbus Portable Speaker", buyer: "Agent #201", reason: result.reason, amount: result.total, status: "pending", created: "just now" };
        STATE.approvals.unshift(approval);
        pushActivity("ban", "Blocked transaction routed to Approvals — " + inr(result.total), "approvals");
      }
      title = "Routed to Approvals · 3 of 4";
      body =
        '<p style="font-size:13px; color:var(--text-soft); margin-bottom:14px;">Because the transaction failed policy, it never reached checkout — it landed in your Approvals queue as a real, pending item instead of failing silently or just going through.</p>' +
        '<div class="money-hero"><div class="mh-label">Awaiting approval</div><div class="mh-amount">' + inr(approval.amount) + '</div>' +
        '<div class="mh-sub">' + esc(approval.buyer) + ' · ' + esc(approval.reason) + '</div></div>';
      foot = '<button class="btn" data-close="1">Cancel</button><button class="btn primary" id="pf_next">Continue</button>';
    } else {
      title = "Recorded to the audit trail · 4 of 4";
      body =
        '<p style="font-size:13px; color:var(--text-soft); margin-bottom:14px;">Every step above — the cart, the policy verdict, the routing decision — is now a hash-chained entry. Each entry\'s hash depends on the one before it, so nothing here can be edited after the fact without breaking the chain.</p>' +
        '<div id="pf_auditOut"><div class="check-item pending"><span class="ico">…</span><span>Writing to the audit log…</span></div></div>';
      foot = '<button class="btn" data-close="1">Close</button><button class="btn primary" id="pf_done" disabled>Recording…</button>';
    }
    openModal({
      title: title, wide: true, body: body, foot: foot,
      onMount: function (root) {
        var nextBtn = qs("#pf_next", root);
        if (nextBtn) on(nextBtn, "click", function () { stage++; render(); });
        if (stage === 3) {
          // Outcome vocabulary matches the rest of the app (PASS/FAIL/PENDING/INFO)
          // so these entries pick up the same red/amber coloring everywhere they
          // surface, not just here.
          auditAppend("POLICY_CHECK", "FAIL", "policy_engine", result.reason, { cart: scriptedCart, total: result.total })
            .then(function (e1) {
              auditEntries.push(e1);
              return auditAppend("APPROVAL_QUEUED", "PENDING", "approval_router", "Routed to human approval after policy block.", { approvalId: approval.id });
            })
            .then(function (e2) {
              auditEntries.push(e2);
              var out = qs("#pf_auditOut", root);
              // Motion moment: each entry arrives as its own card, staggered,
              // with its hash as the dominant element — this is the proof
              // artifact, so it gets the visual weight, not the timestamp.
              if (out) out.innerHTML = auditEntries.map(function (e, i) {
                var tone = auditTone(e.outcome);
                return '<div class="card card-pad new-entry" style="margin-bottom:10px; animation-delay:' + (i * 160) + 'ms; border-left:3px solid var(--' + (tone === "bad" ? "danger" : tone === "warn" ? "warning" : "success") + ');">' +
                  '<div class="row between" style="margin-bottom:8px;"><span class="badge ' + tone + '">' + esc(e.step.replace(/_/g, " ")) + '</span><span style="font-size:11px; color:var(--text-faint);">' + esc(e.reason) + '</span></div>' +
                  '<div class="hash-hero" style="margin-bottom:0; padding:10px 12px;"><div class="hh-label">Hash</div><div class="hh-value" style="font-size:12.5px;">' + esc(e.hash.slice(0, 24)) + '…</div></div>' +
                '</div>';
              }).join("");
              var doneBtn = qs("#pf_done", root);
              if (doneBtn) {
                doneBtn.disabled = false;
                doneBtn.textContent = "View Audit Trail";
                on(doneBtn, "click", function () { closeModal(); navigate("audit"); });
              }
            });
        }
      }
    });
  }
  render();
}

async function simRunOrderSequence(evalRes) {
  STATE.sim.stage = "authorizing";
  simRenderAuthPanel();
  var steps = ["Checking authorization…", "Checking inventory…", "Checking merchant policy…", evalRes.verdict === "BLOCKED" ? "Policy check failed…" : "Creating Razorpay Test Mode order…"];
  simPush("system", steps[0]);
  await sleep(420);
  simPush("system", steps[1]);
  await sleep(420);
  simPush("system", steps[2]);
  await sleep(420);

  auditAppend("INTENT_RECEIVED", "INFO", "protocol_bridge:acp", "Buyer simulator intent received", { items: STATE.sim.cart.map(function(i){return i.sku;}) });
  auditAppend("POLICY_CHECK", evalRes.verdict === "BLOCKED" ? "FAIL" : "PASS", "guardrail_gate", evalRes.reason, { total: evalRes.total, authLimit: evalRes.authLimit });

  if (evalRes.verdict === "BLOCKED") {
    simPush("acos", "I can't complete this automatically: " + evalRes.reason);
    auditAppend("FAILURE", "FAIL", "guardrail_gate", "Order blocked by policy", { total: evalRes.total });
    toast("Blocked by policy — see reason in chat.", "err");
    STATE.sim.stage = "done";
    simRenderMessages(); simRenderAuthPanel();
    return;
  }
  if (evalRes.verdict === "REQUIRES_HUMAN") {
    simPush("acos", "This exceeds the auto-approval threshold, so I've sent it to a human for review. You'll see it in Approvals.");
    STATE.approvals.unshift({ id: uid("appr"), kind: "limit", title: inr(evalRes.total) + " purchase", buyer: "Buyer Simulator", reason: "Exceeds autonomous limit of " + inr(STATE.policy.humanApprovalAbove) + ".", amount: evalRes.total, status: "pending", created: "just now" });
    pushNotification("hourglass", "warn", "New approval needed — " + inr(evalRes.total) + " purchase from simulator.", "approvals");
    auditAppend("SETTLEMENT", "INFO", "guardrail_gate", "Routed to human approval", { total: evalRes.total });
    toast("Sent for human approval.", "warn");
    STATE.sim.stage = "done";
    simRenderMessages(); simRenderAuthPanel();
    return;
  }

  simPush("system", steps[3]);
  await sleep(500);

  var order = null;
  var isLive = false;
  var sessionId = null;
  var backendReason = null;

  if (STATE.connected) {
    var payload = {
      protocol: "acp", checkout_session_id: uid("cs"),
      buyer_agent: { agent_id: "sim-buyer", agent_name: "A-COS Buyer Simulator", agent_platform: "acp-runtime", on_behalf_of_user_id: "sim-user" },
      line_items: STATE.sim.cart.map(function (it) { return { sku: it.sku, quantity: 1, quoted_unit_price_inr: it.price }; }),
      currency: "INR", pre_authorized_limit_inr: evalRes.authLimit
    };
    var r = await apiFetch("/agent/v1/checkout", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
    if (r.ok && r.body && r.body.status === "ORDER_CREATED") {
      order = { id: r.body.razorpay_order && r.body.razorpay_order.id ? r.body.razorpay_order.id : r.body.intent_id, live: true };
      sessionId = r.body.checkout_session_id;
      isLive = true;
    } else if (r.body && r.body.status === "PENDING_HUMAN_APPROVAL") {
      simPush("acos", "This exceeds the auto-approval threshold — I've routed it to a human for review (real approval request, see Approvals).");
      toast("Sent for real human approval — see Approvals.", "warn");
      STATE.sim.stage = "done";
      simRenderMessages(); simRenderAuthPanel();
      return;
    } else if (r.body) {
      // Real backend reached, but it genuinely refused — show the real reason, never fake success.
      backendReason = r.body.reason || r.body.error || "Backend declined the checkout.";
    } else {
      backendReason = "Could not reach the backend.";
    }
  }

  if (!order) {
    if (STATE.connected && backendReason) {
      simPush("acos", "I couldn't complete this against your live backend: " + esc(backendReason) + (backendReason.indexOf("RAZORPAY_KEY") > -1 ? " Falling back to a clearly-labeled simulated order so you can still see the full flow." : ""));
    }
    order = { id: "demo_order_" + Math.random().toString(36).slice(2, 8), live: false };
  }

  var auditEntry = await auditAppend(isLive ? "ORDER_CREATED" : "SIMULATED_PAYMENT_EVENT", "PASS", isLive ? "protocol_bridge" : "dev_tools:simulate",
    (isLive ? "Real Razorpay Test Mode order created — payment NOT yet captured" : "SIMULATED order created (no live backend order)") + " " + order.id,
    { order_id: order.id, total: evalRes.total, checkout_session_id: sessionId });

  simPush("acos", (isLive
      ? "✓ Razorpay Test Mode order created. Payment has <b>not</b> been captured yet — that only happens on a real webhook or a Test Lab simulated payment."
      : "✓ Order created (SIMULATED — no backend connection, so nothing was sent to Razorpay).")
    + '<br><span class="mono" style="font-size:12px; color:var(--text-faint);">' + order.id + '</span>');

  var orderRecord = {
    id: order.id, buyer: "Buyer Simulator", amount: evalRes.total,
    status: isLive ? "ORDER_CREATED" : "SIMULATED",
    orderStatus: isLive ? "CREATED" : "NONE", paymentStatus: "NONE",
    policy: "pass", risk: "Low", created: "Just now", items: STATE.sim.cart.map(function (it) { return { name: it.name, price: it.price }; }),
    authLimit: evalRes.authLimit, protocol: "acp", auditId: auditEntry.id, simulated: !isLive, checkoutSessionId: sessionId
  };
  STATE.orders.unshift(orderRecord);
  STATE.aiOrders += 1;
  pushActivity(isLive ? "check" : "clock", (isLive ? "Razorpay Test Mode order created (payment pending)" : "SIMULATED order created") + " — " + order.id, "orders");
  pushNotification(isLive ? "check" : "clock", isLive ? "ok" : "info", "Order " + order.id + " created for " + inr(evalRes.total) + " — payment not yet captured.", "orders");
  toast("Order created: " + order.id + " (payment pending)", isLive ? "ok" : "info");

  STATE.sim.stage = "done"; STATE.sim.lastOrder = orderRecord;
  simRenderMessages(); simRenderAuthPanel();

  if (isLive && sessionId) {
    simPush("system",
      '<button class="btn sm" data-sim-pay="' + esc(sessionId) + '">Simulate Test Payment (Test Lab)</button> ' +
      '<span style="font-size:11px; color:var(--text-faint);">— this sandbox can\'t receive a real Razorpay webhook, so this is the honest way to demo capture.</span>');
    simRenderMessages();
  }
}

        if (STATE.route === "orders" || STATE.route === "payments") renderRoute();

function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
function simPush(who, text) { STATE.sim.messages.push({ who: who, text: text }); simRenderMessages(); }

function simSend(text) {
  if (!text) return;
  if (STATE.sim.stage === "done" && /new conversation/i.test(text)) { STATE.sim = freshSim(); simRenderMessages(); simRenderAuthPanel(); return; }
  simPush("buyer", esc(text));
  var t = text.toLowerCase();
  var stage = STATE.sim.stage;

  if (stage === "start") {
    var p = findProduct("SKU-HEADPHONE-700");
    if (/speaker/.test(t)) p = findProduct("SKU-SPEAKER-2499");
    else if (/cable|accessor|under ₹?200|cheap/.test(t)) p = findProduct("SKU-CABLE-99");
    setTimeout(function () {
      simPush("acos", "I found a good match:" + simProductCardHtml(p));
      STATE.sim.cart = [{ sku: p.sku, name: p.name, price: p.price }];
      STATE.sim.stage = "discovered";
      simRenderMessages(); simRenderAuthPanel();
    }, 380);
    return;
  }
  if (stage === "discovered") {
    var mainSku = STATE.sim.cart[0] && STATE.sim.cart[0].sku;
    var main = findProduct(mainSku);
    if (/travel|include|bundle|yes|recommend/.test(t) && main && main.recommendedWith.length) {
      var rec = findProduct(main.recommendedWith[0]);
      setTimeout(function () {
        simPush("acos", "I recommend the " + rec.name + " for " + inr(rec.price) + "." + simProductCardHtml(rec) +
          '<div style="margin-top:6px; font-size:12.5px;">Bundle: ' + main.name + ' ' + inr(main.price) + ' + ' + rec.name + ' ' + inr(rec.price) + ' = <b>' + inr(main.price + rec.price) + '</b></div>');
        STATE.sim.cart.push({ sku: rec.sku, name: rec.name, price: rec.price });
        STATE.sim.stage = "bundled";
        simRenderMessages(); simRenderAuthPanel();
      }, 380);
    } else {
      setTimeout(function () {
        simPush("acos", "No problem — just the " + main.name + ", " + inr(main.price) + ". Ready to check out?");
        STATE.sim.stage = "bundled";
        simRenderMessages(); simRenderAuthPanel();
      }, 380);
    }
    return;
  }
  if (stage === "bundled") {
    if (/discount|cheaper|lower/.test(t)) {
      setTimeout(function () {
        simPush("acos", "I can offer up to " + STATE.policy.maxDiscountPct + "% within merchant policy. Applying " + STATE.policy.maxDiscountPct + "%.");
        STATE.sim.cart = STATE.sim.cart.map(function (it, i) { return i === 0 ? Object.assign({}, it, { discountPct: STATE.policy.maxDiscountPct }) : it; });
        simRenderAuthPanel();
      }, 350);
      return;
    }
    setTimeout(function () {
      simPush("acos", "Great — running authorization now.");
      simRenderMessages();
      var evalRes = evaluatePolicy(simCartObj());
      simRunOrderSequence(evalRes);
    }, 350);
    return;
  }
  setTimeout(function () { simPush("acos", "Try one of the suggestions below, or start a new conversation."); }, 300);
}

/* ---------------------------------------------------------------------
 * SECTION: Growth — Upsell & Cross-sell Agent + Campaign Orchestrator
 * (spec sections 21/22/23). Real backend when connected: growth.ts
 * computes acceptance-rate-driven revenue/conversion/margin numbers
 * (LIVE once enough real carts are observed, ESTIMATED baseline until
 * then — never presented as more confident than it is), and
 * campaigns.ts enforces that a campaign's discount can never exceed the
 * merchant's own published policy. Offline: the same math runs
 * client-side against the demo catalog, clearly tagged SIMULATED.
 * ------------------------------------------------------------------- */
/** Same rule campaigns.ts validates against: cheapest of the two targeted SKUs, capped at the policy's discount ceiling — a suggested discount that would never itself clear "Create campaign". */
function suggestSafeDiscount(primarySku, companionSku, companionPriceInr) {
  var primaryProduct = findProduct(primarySku) || findProduct(companionSku);
  var cheapestTargeted = Math.min(primaryProduct ? primaryProduct.price : companionPriceInr, companionPriceInr);
  var ceiling = cheapestTargeted * (STATE.policy.maxDiscountPct / 100);
  return Math.max(1, Math.min(Math.round(ceiling * 0.8), Math.floor(ceiling)));
}
function campaignStatusBadge(s) {
  var map = { active: "ok", draft: "neutral", paused: "warn", budget_exhausted: "warn" };
  var label = { active: "ACTIVE", draft: "DRAFT", paused: "PAUSED", budget_exhausted: "BUDGET EXHAUSTED" };
  return '<span class="badge ' + (map[s] || "neutral") + '">' + (label[s] || String(s).toUpperCase()) + '</span>';
}
function confidenceChip(c) {
  return c === "LIVE"
    ? '<span class="badge ok" title="Backed by real observed carts">Live data</span>'
    : '<span class="badge neutral" title="Baseline estimate from catalog margin data — not yet enough real samples to call this live">Estimated</span>';
}

          else { errEl.textContent = (r.body && r.body.error) || "Could not create campaign."; errEl.style.display = "block"; }
          return;
        }

        // Demo-mode: run the SAME guardrail the backend runs, so a rejected

        var cheapest = Math.min.apply(null, selectedSkus.map(function (sku) { var p = findProduct(sku); return p ? p.price : Infinity; }));
        var discountPct = (input.discount_inr / cheapest) * 100;
        if (discountPct > STATE.policy.maxDiscountPct) {
          errEl.textContent = "Discount " + inr(input.discount_inr) + " is " + discountPct.toFixed(1) + "% of the cheapest targeted product (" + inr(cheapest) + "), exceeding your policy's " + STATE.policy.maxDiscountPct + "% cap. Lower the discount or raise the discount policy first.";
          errEl.style.display = "block";
          return;
        }
        var newCampaign = {
          campaign_id: uid("camp"), name: input.name, trigger_intent: input.trigger_intent, product_skus: selectedSkus,
          discount_inr: input.discount_inr, max_discount_pct: Math.round(discountPct * 10) / 10, budget_inr: input.budget_inr, spent_inr: 0,
          daily_order_limit: input.daily_order_limit, redemptions: 0, status: "draft", created_at: new Date().toISOString()
        };
        STATE.campaigns.unshift(newCampaign);
        closeModal(); toast("Campaign created as a draft (SIMULATED).", "ok"); navigate("campaigns");
      });
    }
  });
}

/** Normalizes both real backend approvals (approval_id/kind/checkout_session_id) and local demo ones (id/title) to one shape. */
function allApprovals() {
  var real = STATE.liveApprovals.map(function (a) {
    return { id: a.approval_id, title: (a.kind === "limit" ? inr(a.amount_inr) + " purchase" : a.title || a.kind), buyer: a.checkout_session_id, reason: a.reason, amount: a.amount_inr, status: a.status, created: new Date(a.created_at).toLocaleTimeString(), live: true, raw: a };
  });
  var demo = STATE.approvals.map(function (a) { return Object.assign({ live: false }, a); });
  return real.concat(demo);
}
VIEWS["approvals"] = function () {
  var all = allApprovals();
  var pending = all.filter(function (a) { return a.status === "pending"; });
  var resolved = all.filter(function (a) { return a.status !== "pending"; });
  if (!pending.length && !resolved.length) return pageHead("Approvals", "Sensitive actions route here instead of executing blind.") + emptyState("Nothing pending", "Approval requests from the Buyer Simulator, live checkout, or Policy Simulator will show up here.");
  return pageHead("Approvals", pending.length + " action" + (pending.length === 1 ? "" : "s") + " need your approval.",

    (resolved.length ? '<h3 style="font-size:13px; color:var(--text-soft); margin-bottom:10px;">Resolved</h3><div style="display:flex; flex-direction:column; gap:10px;">' + resolved.slice(0, 8).map(approvalRowHtml).join("") + '</div>' : '');
};
function approvalRowHtml(a) {

    '<div><div class="row gap-8"><b style="font-size:13.5px;">' + esc(a.title) + '</b>' + (resolved ? statusBadge(a.status.toUpperCase()) : '') + ' ' + dataSourceTag(!a.live) + '</div>' +

window.__routeMount["approvals"] = function (view) {
  syncLive("approvals");
  qsa("[data-review]", view).forEach(function (el) { on(el, "click", function () { openApprovalReview(el.getAttribute("data-review"), el.getAttribute("data-live") === "true"); }); });
  on(qs("#exportApprovalsCsvBtn"), "click", function () {
    var cols = ["id", "title", "buyer_or_session", "amount_inr", "reason", "status", "created", "source"];
    var rows = allApprovals().map(function (a) {

    });
